<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArunCode_Message</title>
  <style>
    :root { color-scheme: dark; --bg:#07111d; --panel:#101b2a; --panel-2:#172536; --text:#eaf4ff; --muted:#8aa0b9; --accent:#3ddc97; --accent-2:#34b4ff; --danger:#ff6b6b; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#07111d,#0e1a2a);color:var(--text);min-height:100vh}
    .app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
    .sidebar{background:rgba(7,17,29,.92);border-right:1px solid rgba(255,255,255,.08);padding:20px;display:flex;flex-direction:column;gap:16px}
    .brand{font-size:1.3rem;font-weight:800;letter-spacing:2px;text-transform:uppercase}
    .brand span{color:var(--accent)}
    .panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px}
    .user-list{display:flex;flex-direction:column;gap:10px;max-height:280px;overflow:auto}
    .user{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);cursor:pointer}
    .user:hover{background:rgba(255,255,255,.08)}
    .user .left{display:flex;align-items:center;gap:10px}
    .avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));font-weight:700}
    .small{font-size:.8rem;color:var(--muted)}
    .main{display:flex;flex-direction:column;padding:20px;gap:16px}
    .header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
    .chat{flex:1;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
    .bubble{max-width:70%;padding:12px 14px;border-radius:16px;line-height:1.5;word-break:break-word}
    .bubble.me{margin-left:auto;background:linear-gradient(135deg,var(--accent),#2bbd82);color:#062117}
    .bubble.other{background:var(--panel-2);color:var(--text)}
    .bubble img{width:100%;max-width:280px;border-radius:12px;margin-top:8px}
    .composer{display:flex;gap:10px;align-items:flex-end}
    .composer textarea{flex:1;border:none;border-radius:12px;padding:12px 14px;min-height:48px;resize:none;background:#f2f7ff;color:#082033}
    .composer button,.ghost{border:none;border-radius:12px;padding:10px 12px;background:var(--accent);color:#042114;font-weight:700;cursor:pointer}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--text)}
    .header-actions{display:flex;align-items:center;gap:8px}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(61,220,151,.16);color:var(--accent);font-size:.75rem;margin-top:4px}
    .status{color:var(--muted);font-size:.9rem}
    @media (max-width: 900px){.app{grid-template-columns:1fr}.sidebar{order:2}.main{order:1}}
    @media (max-width: 480px){.header{flex-direction:column;align-items:flex-start;gap:8px}.composer{flex-wrap:wrap}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">ArunCode<span>_Message</span></div>
      <div class="panel">
        <div class="small">Online ArunCode people</div>
        <div id="userList" class="user-list"></div>
      </div>
      <div class="panel">
        <div class="small">How it works</div>
        <div style="margin-top:8px;line-height:1.6;color:#b9cbe0">Send text messages or attach pictures. This is a simple WhatsApp-style chat space for ArunCode people.</div>
      </div>
    </aside>
    <main class="main">
      <div class="header">
        <div>
          <div id="chatTitle" style="font-weight:700">ArunCode_Message</div>
          <div class="status" id="chatStatus">Pick someone and start chatting</div>
        </div>
        <div class="header-actions">
          <button id="refreshBtn" class="ghost" type="button">↻ Refresh</button>
          <a class="ghost" href="/" style="text-decoration:none">← Launcher</a>
        </div>
      </div>
      <div id="chat" class="chat"></div>
      <div class="composer">
        <textarea id="messageInput" placeholder="Type a message..."></textarea>
        <input id="fileInput" type="file" accept="image/*" style="display:none">
        <button id="attachBtn" class="ghost" type="button">📷</button>
        <button id="sendBtn" type="button">Send</button>
      </div>
    </main>
  </div>
  <script>
    const state = {user: '', room: null, users: {}, messages: []};
    const chat = document.getElementById('chat');
    const userList = document.getElementById('userList');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const chatTitle = document.getElementById('chatTitle');
    const chatStatus = document.getElementById('chatStatus');
    const refreshBtn = document.getElementById('refreshBtn');

    async function getJson(url, options = {}) {
      const response = await fetch(url, {credentials:'same-origin', ...options});
      const data = await response.json();
      return data;
    }

    function renderUsers() {
      if (!Object.keys(state.users).length) {
        userList.innerHTML = '<div class="small">No other users loaded yet.</div>';
        return;
      }
      userList.innerHTML = '';
      Object.entries(state.users).forEach(([name, info]) => {
        const row = document.createElement('div');
        row.className = 'user';
        row.innerHTML = `<div class="left"><div class="avatar">${name.slice(0,1).toUpperCase()}</div><div><div>${name}</div><div class="small">${info.role || 'user'}</div></div></div><div class="pill">online</div>`;
        row.onclick = () => openRoom(name);
        userList.appendChild(row);
      });
    }

    function renderMessages() {
      chat.innerHTML = '';
      if (!state.messages.length) {
        chat.innerHTML = '<div class="small">No messages yet. Start the conversation.</div>';
        return;
      }
      state.messages.forEach(msg => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + (msg.author === state.user ? 'me' : 'other');
        const text = msg.text ? `<div>${msg.text}</div>` : '';
        const media = msg.file ? `<img src="${msg.file}" alt="attachment">` : '';
        bubble.innerHTML = `${text}${media}<div class="small" style="margin-top:6px">${msg.author} • ${new Date(msg.time * 1000).toLocaleTimeString()}</div>`;
        chat.appendChild(bubble);
      });
      chat.scrollTop = chat.scrollHeight;
    }

    async function loadMe() {
      const data = await getJson('/api/me');
      if (data.ok) {
        state.user = data.username;
        chatTitle.textContent = 'Chatting as ' + data.username;
        chatStatus.textContent = 'Choose a person to message';
      }
    }

    async function loadUsers() {
      const data = await getJson('/api/messenger/users');
      if (data.ok) {
        state.users = data.users;
        renderUsers();
      }
    }

    async function openRoom(otherUser) {
      const data = await getJson('/api/messenger/rooms', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name: `${state.user} ↔ ${otherUser}`, members:[state.user, otherUser], dm:true, avatar:''})});
      if (data.ok) {
        state.room = data.id;
        chatTitle.textContent = otherUser;
        chatStatus.textContent = 'Direct message • pictures and text supported';
        await loadMessages(data.id);
      }
    }

    async function loadMessages(roomId) {
      if (!roomId) return;
      const data = await getJson(`/api/messenger/rooms/${roomId}/messages`);
      if (data.ok) {
        const nextMessages = data.messages || [];
        if (JSON.stringify(nextMessages) !== JSON.stringify(state.messages)) {
          state.messages = nextMessages;
          renderMessages();
        }
      }
    }

    async function refreshMessages() {
      if (!state.room) {
        await loadUsers();
        return;
      }
      await loadMessages(state.room);
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!state.room) return;
      if (!text && !state.pendingFile) return;
      const payload = {text, authorAv:''};
      if (state.pendingFile) {
        payload.file = state.pendingFile;
        payload.fileName = state.pendingFileName || 'image';
        payload.fileType = state.pendingFileType || 'image';
      }
      const data = await getJson(`/api/messenger/rooms/${state.room}/messages`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      if (data.ok) {
        messageInput.value = '';
        state.pendingFile = null;
        state.pendingFileName = '';
        state.pendingFileType = '';
        fileInput.value = '';
        await loadMessages(state.room);
      }
    }

    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.pendingFile = reader.result;
        state.pendingFileName = file.name;
        state.pendingFileType = file.type;
        chatStatus.textContent = `Picture ready: ${file.name}`;
      };
      reader.readAsDataURL(file);
    };
    sendBtn.onclick = sendMessage;
    refreshBtn.onclick = refreshMessages;
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    (async function init(){
      await loadMe();
      await loadUsers();
      setInterval(() => {
        refreshMessages();
      }, 3000);
    })();
  </script>
</body>
</html>
